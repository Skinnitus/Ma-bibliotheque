:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color-scheme:dark;--bg:#171625;--panel:#242238;--panel2:#302b43;--text:#f7f0f5;--muted:#b7adbe;--accent:#d899b9;--border:#474056;--input:#211e31}body.light{color-scheme:light;--bg:#f8f2f1;--panel:#fff;--panel2:#f2e5eb;--text:#301d2a;--muted:#73616c;--accent:#823655;--border:#e3d1d9;--input:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}header{position:sticky;top:0;background:var(--bg);z-index:5;padding:18px max(18px,calc((100vw - 1100px)/2));border-bottom:1px solid var(--border)}header .top{display:flex;justify-content:space-between;align-items:center;gap:12px}.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--accent);font-weight:700}h1{margin:4px 0;font-size:25px}h2{font-size:20px;margin:0 0 15px}h3{font-size:16px;margin:0 0 8px}.muted,small{color:var(--muted)}main{max-width:1100px;margin:auto;padding:20px 18px 100px}.btn{border:1px solid var(--border);background:var(--panel2);color:var(--text);padding:11px 14px;border-radius:12px}.primary{background:var(--accent);color:var(--bg);font-weight:750;border-color:transparent}.danger{color:#ed8d9a}.iconbtn{border:0;background:var(--panel);color:var(--text);border-radius:12px;padding:10px 12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:22px}.stat,.card,.box{background:var(--panel);border:1px solid var(--border);border-radius:17px;padding:16px}.stat strong{display:block;font-size:29px;margin:5px 0}.stat span{font-size:12px;color:var(--muted)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 15px}.toolbar>*{flex:1;min-width:125px}input,select,textarea{width:100%;background:var(--input);border:1px solid var(--border);color:var(--text);border-radius:11px;padding:11px;outline-offset:2px}textarea{min-height:78px;resize:vertical}.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:13px}.book{padding:0;overflow:hidden;cursor:pointer}.cover{height:185px;background:linear-gradient(145deg,#65334f,#302743);display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;font-size:17px;font-weight:700;padding:15px}.cover img{width:100%;height:100%;object-fit:contain}.bookinfo{padding:12px}.bookinfo strong{display:block;line-height:1.3}.bookinfo small{display:block;margin-top:5px}.pill{display:inline-block;background:var(--panel2);padding:4px 8px;border-radius:99px;font-size:11px;margin-top:8px;color:var(--accent)}.nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--panel);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:8px 3px max(8px,env(safe-area-inset-bottom))}.nav button{color:var(--muted);border:0;background:transparent;padding:6px 2px;font-size:11px;min-width:56px}.nav button.active{color:var(--accent);font-weight:800}.nav b{display:block;font-size:21px;margin-bottom:3px}.section{margin-bottom:25px}.empty{text-align:center;padding:35px 15px;color:var(--muted)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.listitem{padding:12px 0;border-bottom:1px solid var(--border)}.listitem:last-child{border:0}.modalwrap{position:fixed;inset:0;z-index:20;background:#000b;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:16px}.modal{width:min(650px,100%);background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:20px;margin:15px auto 60px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}.field input,.field select,.field textarea{margin-top:5px;color:var(--text)}.wide{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.actions button{flex:1}.note{font-size:12px;color:var(--muted);line-height:1.6}.bar{height:10px;background:var(--panel2);border-radius:99px;overflow:hidden;margin:8px 0 16px}.bar span{display:block;height:100%;background:var(--accent)}.reading-progress{margin-top:9px}.reading-progress .bar{margin:5px 0 2px}.reading-progress small{font-size:11px}.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--bg);z-index:50;padding:12px 18px;border-radius:12px;box-shadow:0 6px 24px #0006}.hide{display:none!important}@media(min-width:750px){.stats{grid-template-columns:repeat(4,1fr)}.grid{grid-template-columns:repeat(3,1fr)}.nav{position:static;max-width:1100px;margin:auto;border:0;background:transparent;justify-content:flex-start;gap:15px;padding:10px 0 0}.nav button{font-size:13px}.nav b{display:inline;font-size:16px;margin-right:7px}main{padding-bottom:50px}}@media(max-width:400px){.fields{grid-template-columns:1fr}.books{grid-template-columns:repeat(2,minmax(0,1fr))}.cover{height:160px}}
.v11-controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}.v11-controls label{display:flex;gap:6px;align-items:center}.v11-controls select{max-width:170px}.v11-view{display:flex;gap:5px}.v11-controls .selected{outline:2px solid var(--accent)}.books.list-view{display:flex;flex-direction:column;gap:8px}.books.list-view .book{display:flex;flex-direction:row;align-items:center;gap:12px;width:100%}.books.list-view .cover{width:76px;min-width:76px;max-width:76px;height:106px;flex-shrink:0}.books.list-view .bookinfo{flex:1;min-width:0}.books.list-view .cover img{width:100%;height:100%;object-fit:cover}
</style></head><body><header><div class="top"><div><div class="eyebrow">MA BIBLIOTHÈQUE · V2.0.0</div><h1 id="heading">Ma collection</h1></div><div><button class="iconbtn" id="theme" aria-label="Changer de thème">☼</button> <button class="btn primary" id="add">＋ Ajouter</button></div></div></header><main id="app"></main><nav class="nav" id="nav" aria-label="Navigation"><button data-page="home"><b>⌂</b>Accueil</button><button data-page="collection"><b>▤</b>Livres</button><button data-page="reading"><b>◫</b>Lectures</button><button data-page="series"><b>▥</b>Séries</button><button data-page="wishlist"><b>♡</b>Souhaits</button><button data-page="more"><b>☷</b>Plus</button><button data-page="v2" id="v2tab"><b>◷</b>Suivi</button></nav><div id="overlay"></div><script>

'use strict';const KEY='ma-bibliotheque-v1',THEME='ma-bibliotheque-theme',UIKEY='ma-bibliotheque-ui-v1';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now()+'-'+Math.random().toString(36).slice(2);const today=()=>new Date().toISOString().slice(0,10);const blank=()=>({id:uid(),workId:'',title:'',originalTitle:'',authors:'',isbn:'',genre:'',tags:'',language:'fr',kind:'Roman',format:'Papier',publisher:'',published:'',pages:'',series:'',volume:'',cover:'',ownership:'owned',reading:'unread',progress:0,rating:0,review:'',started:'',finished:'',acquired:'',price:'',location:'',favorite:false,created:today()});let db={version:1,books:[]},page='home',query='',filterLanguage='',filterGenre='',filterStatus='',filterKind='',filterFormat='',filterSeries='',filterRating='',viewMode='grid',sortMode='recent',sortDirection='desc';
const norm=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('fr').trim();
const collator=new Intl.Collator('fr',{sensitivity:'base',numeric:true});
function persistUI(){try{localStorage.setItem(UIKEY,JSON.stringify({viewMode,sortMode,sortDirection,query,filterLanguage,filterGenre,filterStatus,filterKind,filterFormat,filterSeries,filterRating}))}catch(e){console.warn('Préférences non enregistrées',e)}}
try{const p=JSON.parse(localStorage.getItem(UIKEY)||'null');if(p&&typeof p==='object'){
if(['grid','list'].includes(p.viewMode))viewMode=p.viewMode;
if(['recent','title','authors','published','rating','pages','progress'].includes(p.sortMode))sortMode=p.sortMode;
if(['asc','desc'].includes(p.sortDirection))sortDirection=p.sortDirection;
for(const k of ['query','filterLanguage','filterGenre','filterStatus','filterKind','filterFormat','filterSeries','filterRating'])if(typeof p[k]==='string'&&p[k].length<250)({query:v=>query=v,filterLanguage:v=>filterLanguage=v,filterGenre:v=>filterGenre=v,filterStatus:v=>filterStatus=v,filterKind:v=>filterKind=v,filterFormat:v=>filterFormat=v,filterSeries:v=>filterSeries=v,filterRating:v=>filterRating=v})[k](p[k]);
}}catch(e){console.warn('Préférences illisibles',e)}
function saveCandidate(candidate){try{localStorage.setItem(KEY,JSON.stringify(candidate));db=candidate;return true}catch(e){alert('Enregistrement impossible : les données existantes sont conservées. Exportez vos données et vérifiez l’espace disponible.');return false}}
try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&Array.isArray(d.books))db=d}catch(e){alert('Les données locales semblent endommagées. Une restauration JSON peut être nécessaire.')}function save(){return saveCandidate(db)}function toast(msg){const e=document.createElement('div');e.className='toast';e.textContent=msg;document.body.append(e);setTimeout(()=>e.remove(),2400)}function setPage(p){page=p;render()}function lang(l){return({fr:'Français',de:'Allemand',en:'Anglais',other:'Autre'})[l]||l}function cover(b){return b.cover?`<img src="${esc(b.cover)}" alt="Couverture de ${esc(b.title)}" loading="lazy" onerror="this.remove()">`:esc(b.title||'Sans titre')}function readingProgress(b){const total=Number(b.pages),done=Number(b.progress)||0;if(b.reading!=='reading'||!Number.isFinite(total)||total<=0)return '';const pct=Math.max(0,Math.min(100,Math.round(done/total*100)));return `<div class="reading-progress"><small>Progression : ${pct}% (${Math.max(0,done)} / ${total} pages)</small><div class="bar" role="progressbar" aria-label="Progression de lecture" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><span style="width:${pct}%"></span></div></div>`}function card(b){return `<article class="card book" data-open="${esc(b.id)}" tabindex="0" role="button"><div class="cover">${cover(b)}</div><div class="bookinfo"><strong>${esc(b.title)}</strong><small>${esc(b.authors||'Auteur inconnu')}</small><small>${esc(lang(b.language))}${b.series?' · '+esc(b.series)+(b.volume?' #'+esc(b.volume):''):''}</small><span class="pill">${b.ownership==='wish'?'Souhait':status(b.reading)}</span> ${b.rating?'★ '+esc(b.rating)+'/5':''}${readingProgress(b)}</div></article>`}function status(s){return({unread:'À lire',reading:'En cours',done:'Terminé',abandoned:'Abandonné'})[s]||s}function render(){const books=db.books,owned=books.filter(b=>b.ownership==='owned'),read=owned.filter(b=>b.reading==='done'),wishes=books.filter(b=>b.ownership==='wish');$('#heading').textContent=({home:'Ma collection',collection:'Tous mes livres',reading:'Mes lectures',series:'Séries & auteurs',wishlist:'Liste de souhaits',more:'Statistiques & réglages'})[page];document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===page));let html='';if(page==='home'){html=`<div class="stats">${[['Livres possédés',owned.length],['Livres terminés',read.length],['À lire',owned.filter(b=>b.reading==='unread').length],['Souhaits',wishes.length]].map(x=>`<div class="stat"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join('')}</div><section class="section"><div class="row"><h2>Lectures en cours</h2><button class="btn" data-go="reading">Voir tout</button></div><div class="books">${owned.filter(b=>b.reading==='reading').map(card).join('')}</div>${owned.some(b=>b.reading==='reading')?'':'<div class="box empty">Aucune lecture en cours. Ajoute un livre pour commencer.</div>'}</section><section class="section"><div class="row"><h2>Derniers ajouts</h2><button class="btn" data-go="collection">Collection</button></div><div class="books">${[...owned].reverse().slice(0,6).map(card).join('')}</div></section>`}
if(page==='collection'||page==='reading'||page==='wishlist'){
const genres=[...new Set(books.flatMap(b=>(b.genre||'').split(',').map(x=>x.trim()).filter(Boolean)))].sort(collator.compare);
const options=(id,all,items,value)=>`<select id="${id}" aria-label="${all}"><option value="">${all}</option>${items.map(([v,label])=>`<option value="${esc(v)}" ${value===v?'selected':''}>${esc(label)}</option>`).join('')}</select>`;
const kinds=[...new Set(books.map(b=>b.kind).filter(Boolean))].sort(collator.compare);
const formats=[...new Set(books.map(b=>b.format).filter(Boolean))].sort(collator.compare);
const series=[...new Set(books.map(b=>b.series).filter(Boolean))].sort(collator.compare);
html=`<div class="toolbar"><input id="search" placeholder="Titre, auteur, ISBN, série, éditeur…" value="${esc(query)}" aria-label="Rechercher">
${options('flang','Toutes les langues',[['fr','Français'],['de','Allemand'],['en','Anglais'],['other','Autre']],filterLanguage)}
${options('fgenre','Tous les genres',genres.map(x=>[x,x]),filterGenre)}
${options('fstatus','Tous les statuts',['unread','reading','done','abandoned'].map(x=>[x,status(x)]),filterStatus)}
${options('fkind','Tous les types',kinds.map(x=>[x,x]),filterKind)}
${options('fformat','Tous les supports',formats.map(x=>[x,x]),filterFormat)}
${options('fseries','Toutes les séries',series.map(x=>[x,x]),filterSeries)}
${options('frating','Toutes les notes',[1,2,3,4,5].map(x=>[String(x),x+' étoiles minimum']),filterRating)}
</div><div class="v11-controls"><label>Tri ${options('sortmode','Tri',[['recent','Ajouts récents'],['title','Titre'],['authors','Auteur'],['published','Année'],['rating','Note'],['pages','Pages'],['progress','Progression']],sortMode)}</label>
<button class="btn" id="sortdir" type="button" aria-label="Inverser le tri">${sortDirection==='desc'?'↓ Décroissant':'↑ Croissant'}</button>
<div class="v11-view"><button type="button" class="btn ${viewMode==='grid'?'selected':''}" id="viewgrid" aria-pressed="${viewMode==='grid'}">▦ Grille</button><button type="button" class="btn ${viewMode==='list'?'selected':''}" id="viewlist" aria-pressed="${viewMode==='list'}">☷ Liste</button></div>
<button class="btn" type="button" id="resetfilters">Effacer les filtres</button></div>
<p class="muted" id="resultcount" aria-live="polite"></p><div id="results" class="books"></div>`;
setTimeout(updateResults,0)}

if(page==='series'){const groups={};owned.forEach(b=>{if(b.series)(groups[b.series]??=[]).push(b)});const names=Object.keys(groups).sort();html=`<h2>Mes séries (${names.length})</h2>${names.length?names.map(name=>`<div class="box section"><h3>${esc(name)}</h3>${groups[name].sort((a,b)=>(Number(a.volume)||999)-(Number(b.volume)||999)).map(b=>`<div class="listitem row"><span><b>${b.volume?'Tome '+esc(b.volume)+' · ':''}</b>${esc(b.title)}<br><small>${esc(lang(b.language))} · ${esc(status(b.reading))}</small></span><button class="btn" data-open="${esc(b.id)}">Ouvrir</button></div>`).join('')}</div>`).join(''):'<div class="box empty">Les séries apparaîtront ici lorsque tu auras renseigné leur nom sur les fiches.</div>'}<h2>Auteurs</h2>${[...new Set(owned.flatMap(b=>b.authors.split(',').map(x=>x.trim()).filter(Boolean)))].sort().map(a=>`<div class="listitem">${esc(a)} <small>(${owned.filter(b=>b.authors.split(',').map(x=>x.trim()).includes(a)).length} livres)</small></div>`).join('')}`}
if(page==='more'){const langs=['fr','de','en','other'];const genres={};owned.forEach(b=>(b.genre||'Non classé').split(',').forEach(g=>genres[g.trim()||'Non classé']=(genres[g.trim()||'Non classé']||0)+1));const year={};owned.filter(b=>b.reading==='done'&&b.finished).forEach(b=>{const y=b.finished.slice(0,4);year[y]=(year[y]||0)+1});const chart=(title,items)=>`<div class="box section"><h3>${title}</h3>${items.length?items.map(([k,v])=>`<div class="row"><small>${esc(k)}</small><b>${v}</b></div><div class="bar"><span style="width:${Math.round(100*v/Math.max(1,...items.map(x=>x[1])))}%"></span></div>`).join(''):'<p class="muted">Pas encore de données.</p>'}</div>`;html=`<div class="stats">${[['Éditions possédées',owned.length],['Œuvres estimées',new Set(owned.map(b=>b.workId||b.title.trim().toLowerCase()+'|'+b.authors.trim().toLowerCase())).size],['Notes attribuées',owned.filter(b=>b.rating>0).length],['Livres souhaités',wishes.length]].map(x=>`<div class="stat"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join('')}</div>${chart('Langues',langs.map(l=>[lang(l),owned.filter(b=>b.language===l).length]))}${chart('Genres',Object.entries(genres).sort((a,b)=>b[1]-a[1]))}${chart('Lectures terminées par année',Object.entries(year).sort())}<div class="box section"><h3>Données et sauvegardes</h3><p class="note">Les données restent sur cet appareil et dans ce navigateur. Une désinstallation ou un effacement des données du site peut les supprimer. Fais des exports JSON réguliers.</p><p class="note"><strong>Attention :</strong> restaurer un JSON remplace intégralement les livres de cette bibliothèque sur cet appareil. Exportez une sauvegarde avant toute restauration. Cette opération ne fusionne pas les collections.</p><div class="actions"><button class="btn primary" id="export">Exporter JSON</button><button class="btn" id="import">Restaurer JSON</button><input id="importfile" type="file" accept=".json,application/json" class="hide"></div><div class="actions"><button class="btn" id="exportcsv">Exporter CSV</button><button class="btn danger" id="clear">Effacer toute la collection</button></div></div><p class="note">Ma Bibliothèque V2.0.0 · Stockage local · Recherche ISBN via Open Library · Sans compte.</p>`}
$('#app').innerHTML=html;if(page==='more')bindMore()}
function updateResults(){const target=$('#results');if(!target)return;
let arr=db.books.filter(b=>page==='wishlist'?b.ownership==='wish':b.ownership==='owned');
if(page==='reading')arr=arr.filter(b=>b.reading!=='unread');
arr=arr.filter(b=>(!query||norm([b.title,b.originalTitle,b.authors,b.isbn,b.series,b.tags,b.publisher].join(' ')).includes(norm(query)))
&&(!filterLanguage||b.language===filterLanguage)
&&(!filterGenre||(b.genre||'').split(',').map(x=>x.trim()).includes(filterGenre))
&&(!filterStatus||b.reading===filterStatus)
&&(!filterKind||b.kind===filterKind)
&&(!filterFormat||b.format===filterFormat)
&&(!filterSeries||b.series===filterSeries)
&&(!filterRating||Number(b.rating)>=Number(filterRating)));
const originalIndex=new Map(db.books.map((b,i)=>[b.id,i]));
const getValue=b=>{if(sortMode==='recent')return /^\d{4}-\d{2}-\d{2}/.test(b.created||'')?b.created:null;
if(sortMode==='published'){const m=String(b.published||'').match(/(?:18|19|20|21)\d{2}/);return m?Number(m[0]):null}
if(sortMode==='rating'||sortMode==='pages')return b[sortMode]!==''&&b[sortMode]!=null&&Number.isFinite(Number(b[sortMode]))?Number(b[sortMode]):null;
if(sortMode==='progress')return Number(b.pages)>0?Number(b.progress||0)/Number(b.pages):null;
return b[sortMode]||null};
arr.sort((a,b)=>{const x=getValue(a),y=getValue(b);if(x==null||x==='')return y==null||y===''?0:1;if(y==null||y==='')return -1;
let cmp=typeof x==='number'&&typeof y==='number'?x-y:collator.compare(String(x),String(y));
if(sortMode==='recent'&&cmp===0)return sortDirection==='desc'?(originalIndex.get(b.id)-originalIndex.get(a.id)):(originalIndex.get(a.id)-originalIndex.get(b.id));
return sortDirection==='desc'?-cmp:cmp});
target.classList.toggle('list-view',viewMode==='list');target.innerHTML=arr.length?arr.map(card).join(''):'<div class="box empty">Aucun livre ne correspond à ces critères.</div>';

function form(book){const b=book?{...book}:blank();const field=(key,label,type='text',wide=false)=>`<label class="field ${wide?'wide':''}">${label}<input name="${key}" type="${type}" value="${esc(b[key])}" ${type==='number'?'step="any"':''}></label>`;const sel=(key,label,options)=>`<label class="field">${label}<select name="${key}">${options.map(([v,l])=>`<option value="${v}" ${String(b[key])===v?'selected':''}>${l}</option>`).join('')}</select></label>`;const langs=[['fr','Français'],['de','Allemand'],['en','Anglais'],['other','Autre']];$('#overlay').innerHTML=`<div class="modalwrap"><div class="modal" role="dialog" aria-modal="true" aria-label="Fiche livre"><div class="row"><h2>${book?'Modifier le livre':'Ajouter un livre'}</h2><button class="iconbtn" id="close">✕</button></div><form id="bookform"><div class="box section"><div class="row"><h3>Recherche ISBN</h3><button type="button" class="btn" id="lookup">Rechercher</button></div><div class="row"><input name="isbn" placeholder="ISBN-10 ou ISBN-13" value="${esc(b.isbn)}" inputmode="numeric"><button type="button" class="btn" id="scan">Scanner</button></div><p class="note" id="isbnmsg">Recherche et scan nécessitent Internet ou une caméra compatible. Tu peux toujours remplir la fiche manuellement.</p><video id="camera" class="hide" autoplay playsinline style="width:100%;max-height:230px;margin-top:8px"></video><button type="button" class="btn hide" id="stopscan">Arrêter la caméra</button></div><div class="fields">${field('title','Titre *', 'text',true)}${field('originalTitle','Titre original')}${field('authors','Auteur(s), séparés par virgules')}${field('genre','Genres, séparés par virgules')}${field('tags','Tags personnalisés')}${sel('language','Langue',langs)}${sel('kind','Type',[['Roman','Roman'],['BD','BD'],['Manga','Manga'],['Comics','Comics'],['Documentaire','Documentaire'],['Autre','Autre']])}${sel('format','Support',[['Papier','Papier'],['Numérique','Numérique'],['Audio','Audio']])}${field('publisher','Éditeu let stream=null,scanning=false;function closeModal(){scanning=false;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('#overlay').innerHTML=''}function validISBN(value){const s=String(value).replace(/[\s-]/g,'').toUpperCase();if(/^\d{13}$/.test(s))return [...s].reduce((a,c,i)=>a+Number(c)*(i%2?3:1),0)%10===0;if(/^\d{9}[\dX]$/.test(s))return [...s].reduce((a,c,i)=>a+(10-i)*(c==='X'?10:Number(c)),0)%11===0;return false}function detectSeriesFromText(value, bookTitle=''){

  /(?:^|[(:;,\s])(?:red[ -]?rising[ -]?(?:reihe|trilogie)|([\p{L}\d][\p{L}\d .'-]{2,70}?)\s*(?:reihe|series|saga|trilogie|cycle))\s*[,;:–—-]?\s*(?:band|tome|volume|vol\.?|book|teil|part|#)?\s*(\d{1,2})/iu,

async function lookupISBN(){
 const f=$('#bookform'),isbn=f.elements.isbn.value.replace(/[\s-]/g,'');if(!validISBN(isbn)){toast('ISBN invalide');return}
 const msg=$('#isbnmsg');msg.textContent='Recherche en cours…';
 const fill=(key,v)=>{if(v&&!f.elements[key].value)f.elements[key].value=String(v)};
 let found=false,seriesInfo=null;
 // Correspondances ISBN explicitement vérifiées : aucune série n'est devinée.
 const verifiedSeriesByISBN={
  '9783453534414':{name:'Red Rising',volume:'1'}
 };

 try{
  const r=await fetch('https://openlibrary.org/isbn/'+encodeURIComponent(isbn)+'.json');
  if(r.ok){const d=await r.json();found=true;
   fill('title',d.title);fill('publisher',d.publishers?.[0]);fill('published',d.publish_date);fill('pages',d.number_of_pages);
   fill('cover',d.covers?.[0]?'https://covers.openlibrary.org/b/id/'+d.covers[0]+'-L.jpg':'https://covers.openlibrary.org/b/isbn/'+isbn+'-L.jpg');
   if(d.authors?.length){const names=await Promise.all(d.authors.slice(0,5).map(async a=>{try{const x=await fetch('https://openlibrary.org'+a.key+'.json');return (await x.json()).name}catch{return ''}}));fill('authors',names.filter(Boolean).join(', '))}
   const parseEntry=v=>{const t=typeof v==='string'?v:(v&&typeof v.name==='string'?v.name:'');return detectSeriesFromText(t)|| (t?{name:t.trim(),volume:''}:null)};
   if(Array.isArray(d.series)&&d.series.length)seriesInfo=parseEntry(d.series[0]);
   if(!seriesInfo&&d.works?.[0]?.key){try{const wr=await fetch('https://openlibrary.org'+d.works[0].key+'.json');if(wr.ok){const w=await wr.json();if(Array.isArray(w.series)&&w.series.length)seriesInfo=parseEntry(w.series[0])}}catch(e){console.warn('Série Open Library indisponible',e)}}
   if(!seriesInfo)seriesInfo=detectSeriesFromText(d.title);
  }
 }catch(e){console.warn('Open Library indisponible',e)}
 // Google Books sert de seconde source si Open Library ne fournit pas la série.
 if(!seriesInfo||!found){try{
  const r=await fetch('https://www.googleapis.com/books/v1/volumes?q='+encodeURIComponent('isbn:'+isbn)+'&maxResults=5');
  if(r.ok){const d=await r.json();const item=(d.items||[]).find(x=>(x.volumeInfo?.industryIdentifiers||[]).some(id=>String(id.identifier).replace(/[\s-]/g,'')===isbn))||d.items?.[0];
   if(item){found=true;const v=item.volumeInfo||{};fill('title',v.title);fill('authors',(v.authors||[]).join(', '));fill('publisher',v.publisher);fill('published',v.publishedDate);fill('pages',v.pageCount);fill('cover',v.imageLinks?.thumbnail?.replace(/^http:/,'https:'));
    const info=v.seriesInfo||item.seriesInfo;
    if(!seriesInfo&&info?.volumeSeries?.length&&info.bookDisplayNumber){const guess=detectSeriesFromText(v.title+' '+info.bookDisplayNumber);if(guess)seriesInfo=guess}
    if(!seriesInfo)for(const text of [v.title,v.subtitle,v.description]){const guess=detectSeriesFromText(text);if(guess){seriesInfo=guess;break}}
   }
  }
 }catch(e){console.warn('Google Books indisponible',e)}}
 // Priorité aux correspondances ISBN vérifiées lorsqu'aucun catalogue ne donne la série.
 if(!seriesInfo&&verifiedSeriesByISBN[isbn])seriesInfo=verifiedSeriesByISBN[isbn];
 // Le suffixe « 01 » du titre allemand « Red Rising 01 » est une indication de tome.
 if(!seriesInfo)seriesInfo=detectSeriesFromText(f.elements.title.value);
 if(seriesInfo?.name){fill('series',seriesInfo.name);fill('volume',seriesInfo.volume);msg.textContent='Livre trouvé. Série proposée : '+seriesInfo.name+(seriesInfo.volume?' · tome '+seriesInfo.volume:'')+'. Vérifie avant enregistrement.'}
 else msg.textContent=found?'Livre trouvé, mais série non confirmée par les métadonnées. Complète-la manuellement.':'Aucune fiche récupérée. Saisis les informations manuellement.';
 toast(found?'ISBN trouvé':'Recherche impossible');
}
async function scanISBN(){if(!navigator.mediaDevices?.getUserMedia||!('BarcodeDetector'in window)){toast('Scanner indisponible : saisis l’ISBN manuellement');return}try{const detector=new BarcodeDetector({formats:['ean_13','ean_8']});stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const v=$('#camera');v.srcObject=stream;v.classList.remove('hide');$('#stopscan').classList.remove('hide');$('#stopscan').onclick=()=>{scanning=false;stream?.getTracks().forEach(t=>t.stop());stream=null;v.classList.add('hide');$('#stopscan').classList.add('hide')};scanning=true;while(scanning&&stream){const codes=await detector.detect(v).catch(()=>[]);const found=codes.find(x=>validISBN(x.rawValue));if(found){$('#bookform').elements.isbn.value=found.rawValue;$('#stopscan').click();await lookupISBN();break}await new Promise(r=>setTimeout(r,450))}}catch(e){toast('Caméra indisponible ou accès refusé');stream?.getTracks().forEach(t=>t.stop());stream=null}}

$('#newentry').onclick=()=>v2Modal('journal');$('#newloan').onclick=()=>v2Modal('loan');
$('#app').querySelectorAll('[data-delentry]').forEach(b=>b.onclick=()=>{if(confirm('Supprimer cette séance ?')){x.journal=x.journal.filter(e=>e.id!==b.dataset.delentry);if(saveV2(x))renderV2()}});
$('#app').querySelectorAll('[data-delloan]').forEach(b=>b.onclick=()=>{if(confirm('Supprimer ce prêt ?')){x.loans=x.loans.filter(e=>e.id!==b.dataset.delloan);if(saveV2(x))renderV2()}});
$('#app').querySelectorAll('[data-return]').forEach(b=>b.onclick=()=>{const l=x.loans.find(e=>e.id===b.dataset.return);if(l){l.returned=!l.returned;if(saveV2(x))renderV2()}});
}
function v2Modal(kind){const books=db.books.filter(b=>b.ownership==='owned'||b.ownership==='lent');if(!books.length){toast('Ajoute d’abord un livre possédé');return}const isJournal=kind==='journal';$('#overlay').innerHTML=`<div class="modalwrap"><div class="modal"><div class="row"><h2>${isJournal?'Nouvelle séance':'Nouveau prêt'}</h2><button class="btn" id="v2close">Fermer</button></div><form id="v2form"><label class="field">Livre<select name="book" required>${books.map(b=>`<option value="${esc(b.id)}">${esc(b.title)}</option>`).join('')}</select></label><label class="field">Date<input type="date" name="date" value="${today()}" required></label>${isJournal?'<label class="field">Pages lues pendant la séance<input type="number" name="pages" min="0" max="100000" value="0" required></label><label class="field">Note<textarea name="note" maxlength="2000"></textarea></label>':'<label class="field">Emprunteur<input name="person" maxlength="150" required></label><label class="field">Retour prévu (facultatif)<input type="date" name="due"></label>'}<div class="actions"><button class="btn primary" type="submit">Enregistrer</button></div></form></div></div>`;$('#v2close').onclick=closeModal;$('#v2form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),x=readV2(),entry={id:uid(),book:f.get('book'),date:f.get('date')};if(isJournal){entry.pages=Number(f.get('pages'))||0;entry.note=String(f.get('note')||'');x.journal.push(entry)}else{entry.person=String(f.get('person')||'');entry.due=String(f.get('due')||'');entry.returned=false;x.loans.push(entry)}if(saveV2(x)){closeModal();renderV2();toast('Enregistré')}}}

</script></body></html>
