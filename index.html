<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171625"><meta name="description" content="Ma Bibliothèque, catalogue personnel de livres et BD"><link rel="manifest" href="manifest.webmanifest"><title>Ma Bibliothèque V1</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color-scheme:dark;--bg:#171625;--panel:#242238;--panel2:#302b43;--text:#f7f0f5;--muted:#b7adbe;--accent:#d899b9;--border:#474056;--input:#211e31}body.light{color-scheme:light;--bg:#f8f2f1;--panel:#fff;--panel2:#f2e5eb;--text:#301d2a;--muted:#73616c;--accent:#823655;--border:#e3d1d9;--input:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}header{position:sticky;top:0;background:var(--bg);z-index:5;padding:18px max(18px,calc((100vw - 1100px)/2));border-bottom:1px solid var(--border)}header .top{display:flex;justify-content:space-between;align-items:center;gap:12px}.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--accent);font-weight:700}h1{margin:4px 0;font-size:25px}h2{font-size:20px;margin:0 0 15px}h3{font-size:16px;margin:0 0 8px}.muted,small{color:var(--muted)}main{max-width:1100px;margin:auto;padding:20px 18px 100px}.btn{border:1px solid var(--border);background:var(--panel2);color:var(--text);padding:11px 14px;border-radius:12px}.primary{background:var(--accent);color:var(--bg);font-weight:750;border-color:transparent}.danger{color:#ed8d9a}.iconbtn{border:0;background:var(--panel);color:var(--text);border-radius:12px;padding:10px 12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:22px}.stat,.card,.box{background:var(--panel);border:1px solid var(--border);border-radius:17px;padding:16px}.stat strong{display:block;font-size:29px;margin:5px 0}.stat span{font-size:12px;color:var(--muted)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 15px}.toolbar>*{flex:1;min-width:125px}input,select,textarea{width:100%;background:var(--input);border:1px solid var(--border);color:var(--text);border-radius:11px;padding:11px;outline-offset:2px}textarea{min-height:78px;resize:vertical}.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:13px}.book{padding:0;overflow:hidden;cursor:pointer}.cover{height:185px;background:linear-gradient(145deg,#65334f,#302743);display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;font-size:17px;font-weight:700;padding:15px}.cover img{width:100%;height:100%;object-fit:contain}.bookinfo{padding:12px}.bookinfo strong{display:block;line-height:1.3}.bookinfo small{display:block;margin-top:5px}.pill{display:inline-block;background:var(--panel2);padding:4px 8px;border-radius:99px;font-size:11px;margin-top:8px;color:var(--accent)}.nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--panel);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:8px 3px max(8px,env(safe-area-inset-bottom))}.nav button{color:var(--muted);border:0;background:transparent;padding:6px 2px;font-size:11px;min-width:56px}.nav button.active{color:var(--accent);font-weight:800}.nav b{display:block;font-size:21px;margin-bottom:3px}.section{margin-bottom:25px}.empty{text-align:center;padding:35px 15px;color:var(--muted)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.listitem{padding:12px 0;border-bottom:1px solid var(--border)}.listitem:last-child{border:0}.modalwrap{position:fixed;inset:0;z-index:20;background:#000b;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:16px}.modal{width:min(650px,100%);background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:20px;margin:15px auto 60px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}.field input,.field select,.field textarea{margin-top:5px;color:var(--text)}.wide{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.actions button{flex:1}.note{font-size:12px;color:var(--muted);line-height:1.6}.bar{height:10px;background:var(--panel2);border-radius:99px;overflow:hidden;margin:8px 0 16px}.bar span{display:block;height:100%;background:var(--accent)}.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--bg);z-index:50;padding:12px 18px;border-radius:12px;box-shadow:0 6px 24px #0006}.hide{display:none!important}@media(min-width:750px){.stats{grid-template-columns:repeat(4,1fr)}.grid{grid-template-columns:repeat(3,1fr)}.nav{position:static;max-width:1100px;margin:auto;border:0;background:transparent;justify-content:flex-start;gap:15px;padding:10px 0 0}.nav button{font-size:13px}.nav b{display:inline;font-size:16px;margin-right:7px}main{padding-bottom:50px}}@media(max-width:400px){.fields{grid-template-columns:1fr}.books{grid-template-columns:repeat(2,minmax(0,1fr))}.cover{height:160px}}
</style></head><body><header><div class="top"><div><div class="eyebrow">MA BIBLIOTHÈQUE · V1.0</div><h1 id="heading">Ma collection</h1></div><div><button class="iconbtn" id="theme" aria-label="Changer de thème">☼</button> <button class="btn primary" id="add">＋ Ajouter</button></div></div></header><main id="app"></main><nav class="nav" id="nav" aria-label="Navigation"><button data-page="home"><b>⌂</b>Accueil</button><button data-page="collection"><b>▤</b>Livres</button><button data-page="reading"><b>◫</b>Lectures</button><button data-page="series"><b>▥</b>Séries</button><button data-page="wishlist"><b>♡</b>Souhaits</button><button data-page="more"><b>☷</b>Plus</button></nav><div id="overlay"></div><script>
'use strict';const KEY='ma-bibliotheque-v1',THEME='ma-bibliotheque-theme';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now()+'-'+Math.random().toString(36).slice(2);const today=()=>new Date().toISOString().slice(0,10);const blank=()=>({id:uid(),workId:'',title:'',originalTitle:'',authors:'',isbn:'',genre:'',tags:'',language:'fr',kind:'Roman',format:'Papier',publisher:'',published:'',pages:'',series:'',volume:'',cover:'',ownership:'owned',reading:'unread',progress:0,rating:0,review:'',started:'',finished:'',acquired:'',price:'',location:'',favorite:false,created:today()});let db={version:1,books:[]},page='home',query='',filterLanguage='',filterGenre='',filterStatus='';try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&Array.isArray(d.books))db=d}catch(e){alert('Les données locales semblent endommagées. Une restauration JSON peut être nécessaire.')}function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('Stockage saturé ou indisponible. Exportez vos données puis réduisez les images enregistrées.');return false}}function toast(msg){const e=document.createElement('div');e.className='toast';e.textContent=msg;document.body.append(e);setTimeout(()=>e.remove(),2400)}function setPage(p){page=p;render()}function lang(l){return({fr:'Français',de:'Allemand',en:'Anglais',other:'Autre'})[l]||l}function cover(b){return b.cover?`<img src="${esc(b.cover)}" alt="Couverture de ${esc(b.title)}" loading="lazy" onerror="this.remove()">`:esc(b.title||'Sans titre')}function card(b){return `<article class="card book" data-open="${esc(b.id)}" tabindex="0" role="button"><div class="cover">${cover(b)}</div><div class="bookinfo"><strong>${esc(b.title)}</strong><small>${esc(b.authors||'Auteur inconnu')}</small><small>${esc(lang(b.language))}${b.series?' · '+esc(b.series)+(b.volume?' #'+esc(b.volume):''):''}</small><span class="pill">${b.ownership==='wish'?'Souhait':status(b.reading)}</span> ${b.rating?'★ '+esc(b.rating)+'/5':''}</div></article>`}function status(s){return({unread:'À lire',reading:'En cours',done:'Terminé',abandoned:'Abandonné'})[s]||s}function render(){const books=db.books,owned=books.filter(b=>b.ownership==='owned'),read=owned.filter(b=>b.reading==='done'),wishes=books.filter(b=>b.ownership==='wish');$('#heading').textContent=({home:'Ma collection',collection:'Tous mes livres',reading:'Mes lectures',series:'Séries & auteurs',wishlist:'Liste de souhaits',more:'Statistiques & réglages'})[page];document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===page));let html='';if(page==='home'){html=`<div class="stats">${[['Livres possédés',owned.length],['Livres terminés',read.length],['À lire',owned.filter(b=>b.reading==='unread').length],['Souhaits',wishes.length]].map(x=>`<div class="stat"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join('')}</div><section class="section"><div class="row"><h2>Lectures en cours</h2><button class="btn" data-go="reading">Voir tout</button></div><div class="books">${owned.filter(b=>b.reading==='reading').map(card).join('')}</div>${owned.some(b=>b.reading==='reading')?'':'<div class="box empty">Aucune lecture en cours. Ajoute un livre pour commencer.</div>'}</section><section class="section"><div class="row"><h2>Derniers ajouts</h2><button class="btn" data-go="collection">Collection</button></div><div class="books">${[...owned].reverse().slice(0,6).map(card).join('')}</div></section>`}
if(page==='collection'||page==='reading'||page==='wishlist'){let arr=page==='wishlist'?wishes:owned;if(page==='reading')arr=arr.filter(b=>b.reading!=='unread');const genres=[...new Set(books.flatMap(b=>(b.genre||'').split(',').map(x=>x.trim()).filter(Boolean)))].sort();html=`<div class="toolbar"><input id="search" placeholder="Titre, auteur, ISBN, série…" value="${esc(query)}" aria-label="Rechercher"><select id="flang"><option value="">Toutes les langues</option>${['fr','de','en','other'].map(l=>`<option value="${l}" ${filterLanguage===l?'selected':''}>${lang(l)}</option>`).join('')}</select><select id="fgenre"><option value="">Tous les genres</option>${genres.map(g=>`<option ${filterGenre===g?'selected':''}>${esc(g)}</option>`).join('')}</select><select id="fstatus"><option value="">Tous les statuts</option>${['unread','reading','done','abandoned'].map(s=>`<option value="${s}" ${filterStatus===s?'selected':''}>${status(s)}</option>`).join('')}</select></div><p class="muted">${arr.length} livre(s) dans cette section</p><div id="results" class="books"></div>`;setTimeout(updateResults,0)}
if(page==='series'){const groups={};owned.forEach(b=>{if(b.series)(groups[b.series]??=[]).push(b)});const names=Object.keys(groups).sort();html=`<h2>Mes séries (${names.length})</h2>${names.length?names.map(name=>`<div class="box section"><h3>${esc(name)}</h3>${groups[name].sort((a,b)=>(Number(a.volume)||999)-(Number(b.volume)||999)).map(b=>`<div class="listitem row"><span><b>${b.volume?'Tome '+esc(b.volume)+' · ':''}</b>${esc(b.title)}<br><small>${esc(lang(b.language))} · ${esc(status(b.reading))}</small></span><button class="btn" data-open="${esc(b.id)}">Ouvrir</button></div>`).join('')}</div>`).join(''):'<div class="box empty">Les séries apparaîtront ici lorsque tu auras renseigné leur nom sur les fiches.</div>'}<h2>Auteurs</h2>${[...new Set(owned.flatMap(b=>b.authors.split(',').map(x=>x.trim()).filter(Boolean)))].sort().map(a=>`<div class="listitem">${esc(a)} <small>(${owned.filter(b=>b.authors.split(',').map(x=>x.trim()).includes(a)).length} livres)</small></div>`).join('')}`}
if(page==='more'){const langs=['fr','de','en','other'];const genres={};owned.forEach(b=>(b.genre||'Non classé').split(',').forEach(g=>genres[g.trim()||'Non classé']=(genres[g.trim()||'Non classé']||0)+1));const year={};owned.filter(b=>b.reading==='done'&&b.finished).forEach(b=>{const y=b.finished.slice(0,4);year[y]=(year[y]||0)+1});const chart=(title,items)=>`<div class="box section"><h3>${title}</h3>${items.length?items.map(([k,v])=>`<div class="row"><small>${esc(k)}</small><b>${v}</b></div><div class="bar"><span style="width:${Math.round(100*v/Math.max(1,...items.map(x=>x[1])))}%"></span></div>`).join(''):'<p class="muted">Pas encore de données.</p>'}</div>`;html=`<div class="stats">${[['Éditions possédées',owned.length],['Œuvres estimées',new Set(owned.map(b=>b.workId||b.title.trim().toLowerCase()+'|'+b.authors.trim().toLowerCase())).size],['Notes attribuées',owned.filter(b=>b.rating>0).length],['Livres souhaités',wishes.length]].map(x=>`<div class="stat"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join('')}</div>${chart('Langues',langs.map(l=>[lang(l),owned.filter(b=>b.language===l).length]))}${chart('Genres',Object.entries(genres).sort((a,b)=>b[1]-a[1]))}${chart('Lectures terminées par année',Object.entries(year).sort())}<div class="box section"><h3>Données et sauvegardes</h3><p class="note">Les données restent sur cet appareil et dans ce navigateur. Une désinstallation ou un effacement des données du site peut les supprimer. Fais des exports JSON réguliers.</p><div class="actions"><button class="btn primary" id="export">Exporter JSON</button><button class="btn" id="import">Restaurer JSON</button><input id="importfile" type="file" accept=".json,application/json" class="hide"></div><div class="actions"><button class="btn" id="exportcsv">Exporter CSV</button><button class="btn danger" id="clear">Effacer toute la collection</button></div></div><p class="note">Ma Bibliothèque V1.0 · Stockage local · Recherche ISBN via Open Library · Sans compte.</p>`}
$('#app').innerHTML=html;if(page==='more')bindMore()}
function updateResults(){const target=$('#results');if(!target)return;let arr=db.books.filter(b=>page==='wishlist'?b.ownership==='wish':b.ownership==='owned');if(page==='reading')arr=arr.filter(b=>b.reading!=='unread');arr=arr.filter(b=>(!query||[b.title,b.authors,b.isbn,b.series,b.tags].join(' ').toLowerCase().includes(query.toLowerCase()))&&(!filterLanguage||b.language===filterLanguage)&&(!filterGenre||(b.genre||'').split(',').map(x=>x.trim()).includes(filterGenre))&&(!filterStatus||b.reading===filterStatus));target.innerHTML=arr.length?arr.map(card).join(''):'<div class="box empty">Aucun livre ne correspond à ces critères.</div>'}
function form(book){const b=book?{...book}:blank();const field=(key,label,type='text',wide=false)=>`<label class="field ${wide?'wide':''}">${label}<input name="${key}" type="${type}" value="${esc(b[key])}" ${type==='number'?'step="any"':''}></label>`;const sel=(key,label,options)=>`<label class="field">${label}<select name="${key}">${options.map(([v,l])=>`<option value="${v}" ${String(b[key])===v?'selected':''}>${l}</option>`).join('')}</select></label>`;const langs=[['fr','Français'],['de','Allemand'],['en','Anglais'],['other','Autre']];$('#overlay').innerHTML=`<div class="modalwrap"><div class="modal" role="dialog" aria-modal="true" aria-label="Fiche livre"><div class="row"><h2>${book?'Modifier le livre':'Ajouter un livre'}</h2><button class="iconbtn" id="close">✕</button></div><form id="bookform"><div class="box section"><div class="row"><h3>Recherche ISBN</h3><button type="button" class="btn" id="lookup">Rechercher</button></div><div class="row"><input name="isbn" placeholder="ISBN-10 ou ISBN-13" value="${esc(b.isbn)}" inputmode="numeric"><button type="button" class="btn" id="scan">Scanner</button></div><p class="note" id="isbnmsg">Recherche et scan nécessitent Internet ou une caméra compatible. Tu peux toujours remplir la fiche manuellement.</p><video id="camera" class="hide" autoplay playsinline style="width:100%;max-height:230px;margin-top:8px"></video><button type="button" class="btn hide" id="stopscan">Arrêter la caméra</button></div><div class="fields">${field('title','Titre *', 'text',true)}${field('originalTitle','Titre original')}${field('authors','Auteur(s), séparés par virgules')}${field('genre','Genres, séparés par virgules')}${field('tags','Tags personnalisés')}${sel('language','Langue',langs)}${sel('kind','Type',[['Roman','Roman'],['BD','BD'],['Manga','Manga'],['Comics','Comics'],['Documentaire','Documentaire'],['Autre','Autre']])}${sel('format','Support',[['Papier','Papier'],['Numérique','Numérique'],['Audio','Audio']])}${field('publisher','Éditeur')}${field('published','Année de publication')}${field('pages','Nombre de pages','number')}${field('series','Série')}${field('volume','Numéro de tome')}${field('workId','Identifiant commun d’œuvre (facultatif)')}${field('cover','URL de couverture','url',true)}${sel('ownership','Collection',[['owned','Possédé'],['wish','Souhaité'],['lent','Prêté'],['sold','Vendu']])}${sel('reading','Lecture',[['unread','À lire'],['reading','En cours'],['done','Terminé'],['abandoned','Abandonné']])}${field('progress','Pages lues','number')}${sel('rating','Note',[['0','Non noté'],['0.5','½'],['1','★'],['1.5','★½'],['2','★★'],['2.5','★★½'],['3','★★★'],['3.5','★★★½'],['4','★★★★'],['4.5','★★★★½'],['5','★★★★★']])}${field('started','Début de lecture','date')}${field('finished','Fin de lecture','date')}${field('acquired','Date d’acquisition','date')}${field('price','Prix payé / souhaité','number')}${field('location','Emplacement') }<label class="field">Favori<select name="favorite"><option value="false" ${!b.favorite?'selected':''}>Non</option><option value="true" ${b.favorite?'selected':''}>Oui</option></select></label><label class="field wide">Avis personnel<textarea name="review">${esc(b.review)}</textarea></label></div><div class="actions"><button type="submit" class="btn primary">Enregistrer</button>${book?'<button type="button" class="btn danger" id="delete">Supprimer</button>':''}</div></form></div></div>`;$('#close').onclick=closeModal;$('#overlay .modalwrap').addEventListener('click',e=>{if(e.target.classList.contains('modalwrap'))closeModal()});$('#bookform').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target);const o={...b};for(const [k,v] of fd)o[k]=v.trim();if(!o.title){toast('Le titre est obligatoire');return}o.favorite=o.favorite==='true';o.rating=Number(o.rating)||0;o.progress=Math.max(0,Number(o.progress)||0);o.pages=o.pages?Math.max(0,Number(o.pages)):'';if(o.pages&&o.progress>o.pages){toast('Les pages lues dépassent le total');return}if(o.isbn&&!validISBN(o.isbn)){toast('ISBN invalide');return}const i=db.books.findIndex(x=>x.id===o.id);if(i>=0)db.books[i]=o;else db.books.push(o);if(save()){closeModal();render();toast('Livre enregistré')}};$('#lookup').onclick=()=>lookupISBN();$('#scan').onclick=()=>scanISBN();if(book)$('#delete').onclick=()=>{if(confirm('Supprimer définitivement ce livre ?')){db.books=db.books.filter(x=>x.id!==b.id);if(save()){closeModal();render();toast('Livre supprimé')}}}}
let stream=null,scanning=false;function closeModal(){scanning=false;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('#overlay').innerHTML=''}function validISBN(value){const s=String(value).replace(/[\s-]/g,'').toUpperCase();if(/^\d{13}$/.test(s))return [...s].reduce((a,c,i)=>a+Number(c)*(i%2?3:1),0)%10===0;if(/^\d{9}[\dX]$/.test(s))return [...s].reduce((a,c,i)=>a+(10-i)*(c==='X'?10:Number(c)),0)%11===0;return false}async function lookupISBN(){const f=$('#bookform'),isbn=f.elements.isbn.value.replace(/[\s-]/g,'');if(!validISBN(isbn)){toast('ISBN invalide');return}const msg=$('#isbnmsg');msg.textContent='Recherche en cours…';try{const r=await fetch('https://openlibrary.org/isbn/'+encodeURIComponent(isbn)+'.json');if(!r.ok)throw Error('Livre introuvable');const d=await r.json();const fill=(key,v)=>{if(v&&!f.elements[key].value)f.elements[key].value=v};fill('title',d.title);fill('publisher',d.publishers?.[0]);fill('published',d.publish_date);fill('pages',d.number_of_pages);fill('cover',d.covers?.[0]?'https://covers.openlibrary.org/b/id/'+d.covers[0]+'-L.jpg':'https://covers.openlibrary.org/b/isbn/'+isbn+'-L.jpg');if(d.authors?.length){const names=await Promise.all(d.authors.slice(0,5).map(async a=>{try{const x=await fetch('https://openlibrary.org'+a.key+'.json');return (await x.json()).name}catch{return ''}}));fill('authors',names.filter(Boolean).join(', '))}msg.textContent='Données récupérées. Vérifie la langue, le tome et les informations avant d’enregistrer.';toast('ISBN trouvé')}catch(e){msg.textContent='Aucune fiche récupérée. Saisis les informations manuellement.';toast('Recherche impossible')}}async function scanISBN(){if(!navigator.mediaDevices?.getUserMedia||!('BarcodeDetector'in window)){toast('Scanner indisponible : saisis l’ISBN manuellement');return}try{const detector=new BarcodeDetector({formats:['ean_13','ean_8']});stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const v=$('#camera');v.srcObject=stream;v.classList.remove('hide');$('#stopscan').classList.remove('hide');$('#stopscan').onclick=()=>{scanning=false;stream?.getTracks().forEach(t=>t.stop());stream=null;v.classList.add('hide');$('#stopscan').classList.add('hide')};scanning=true;while(scanning&&stream){const codes=await detector.detect(v).catch(()=>[]);const found=codes.find(x=>validISBN(x.rawValue));if(found){$('#bookform').elements.isbn.value=found.rawValue;$('#stopscan').click();await lookupISBN();break}await new Promise(r=>setTimeout(r,450))}}catch(e){toast('Caméra indisponible ou accès refusé');stream?.getTracks().forEach(t=>t.stop());stream=null}}
function download(content,name,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}function bindMore(){$('#export').onclick=()=>download(JSON.stringify({...db,exportedAt:new Date().toISOString()},null,2),'ma-bibliotheque-'+today()+'.json','application/json');$('#import').onclick=()=>$('#importfile').click();$('#importfile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>10*1024*1024)throw Error('Fichier trop volumineux (max 10 Mo)');const data=JSON.parse(await file.text());if(!data||data.version!==1||!Array.isArray(data.books)||data.books.some(b=>!b||typeof b.id!=='string'||typeof b.title!=='string'||typeof b.authors!=='string'))throw Error('Format de sauvegarde non reconnu');if(new Set(data.books.map(b=>b.id)).size!==data.books.length)throw Error('Identifiants dupliqués');if(confirm('Remplacer toute la bibliothèque actuelle par '+data.books.length+' livres ? Pense à exporter ta collection avant.')){const previous=db;db={version:1,books:data.books};if(save()){render();toast('Bibliothèque restaurée')}else db=previous}}catch(err){alert('Import impossible : '+err.message)}};$('#exportcsv').onclick=()=>{const keys=['title','authors','isbn','genre','language','kind','series','volume','ownership','reading','rating','pages','finished'];const rows=[keys,...db.books.map(b=>keys.map(k=>String(b[k]??'')))];download('\ufeff'+rows.map(r=>r.map(v=>'"'+v.replace(/"/g,'""')+'"').join(';')).join('\r\n'),'ma-bibliotheque-'+today()+'.csv','text/csv;charset=utf-8')};$('#clear').onclick=()=>{if(confirm('ATTENTION : supprimer TOUS les livres ? Fais une sauvegarde JSON avant.'))if(confirm('Confirmer la suppression définitive de toute la collection ?')){db={version:1,books:[]};if(save()){render();toast('Collection effacée')}}}}
$('#nav').onclick=e=>{const b=e.target.closest('[data-page]');if(b)setPage(b.dataset.page)};$('#add').onclick=()=>form();$('#theme').onclick=()=>{document.body.classList.toggle('light');localStorage.setItem(THEME,document.body.classList.contains('light')?'light':'dark')};$('#app').addEventListener('click',e=>{const o=e.target.closest('[data-open]');if(o){const b=db.books.find(x=>x.id===o.dataset.open);if(b)form(b)}const g=e.target.closest('[data-go]');if(g)setPage(g.dataset.go)});$('#app').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[data-open]')){const b=db.books.find(x=>x.id===e.target.dataset.open);if(b)form(b)}});$('#app').addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;updateResults()}});$('#app').addEventListener('change',e=>{if(e.target.id==='flang')filterLanguage=e.target.value;if(e.target.id==='fgenre')filterGenre=e.target.value;if(e.target.id==='fstatus')filterStatus=e.target.value;updateResults()});if(localStorage.getItem(THEME)==='light')document.body.classList.add('light');render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
